name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          VITE_DATA_LATENCY_MS: '0'

      - run: npm test

  fidelity:
    name: Fidelity check (macOS Chromium, authoritative)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run test:fidelity
        env:
          VITE_DATA_LATENCY_MS: '0'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fidelity-test-results
          path: test-results/
          retention-days: 14
